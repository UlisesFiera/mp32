name: ft_trascendence
services:
  frontend:
    build:
      context: ./mp32/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./mp32/frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
  backend:
    build:
      context: ./mp32/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./mp32/backend:/app
      - backend_go_modules:/go/pkg/mod
      - backend_go_cache:/root/.cache/go-build
    restart:  unless-stopped

volumes:
  frontend_node_modules:
  backend_go_modules:
  backend_go_cache: