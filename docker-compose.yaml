name: ft_trascendence
services:
  frontend:
    build:
      context: ./mp32/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./mp32/frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
  backend:
    build:
      context: ./mp32/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mp32/backend:/app
      - backend_go_modules:/go/pkg/mod
      - backend_go_cache:/root/.cache/go-build
    restart:  unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mp32/migrations:/migrations:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_go_modules:
  backend_go_cache:
  postgres_data: